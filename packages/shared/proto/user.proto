syntax = "proto3";

package user;

// User service definition
service UserService {
  rpc CreateUser (CreateUserRequest) returns (CreateUserResponse);
  rpc GetUserById (GetUserByIdRequest) returns (GetUserResponse);
  rpc GetUserByEmail (GetUserByEmailRequest) returns (GetUserResponse);
  rpc UpdateUser (UpdateUserRequest) returns (UpdateUserResponse);
  rpc DeleteUser (DeleteUserRequest) returns (DeleteUserResponse);
}

// User model
message User {
  string id = 1;
  string firstName = 2;
  string lastName = 3;
  string email = 4;
  string location = 5;
  int32 experience = 6;
  repeated string skills = 7;
  UserPreferences preferences = 8;
  string createdAt = 9;
  string updatedAt = 10;
}

message UserPreferences {
  string location = 1;
  bool remote = 2;
  repeated string jobTypes = 3;
  int32 salary = 4;
}

// Create user request and response
message CreateUserRequest {
  string firstName = 1;
  string lastName = 2;
  string email = 3;
  string password = 4;
  string location = 5;
  int32 experience = 6;
  repeated string skills = 7;
  UserPreferences preferences = 8;
}

message CreateUserResponse {
  bool success = 1;
  User user = 2;
  string message = 3;
  string error = 4;
}

// Get user by ID request and response
message GetUserByIdRequest {
  string id = 1;
}

// Get user by email request and response
message GetUserByEmailRequest {
  string email = 1;
}

// Generic user response
message GetUserResponse {
  bool success = 1;
  User user = 2;
  string message = 3;
  string error = 4;
}

// Update user request and response
message UpdateUserRequest {
  string id = 1;
  string firstName = 2;
  string lastName = 3;
  string email = 4;
  string location = 5;
  int32 experience = 6;
  repeated string skills = 7;
  UserPreferences preferences = 8;
}

message UpdateUserResponse {
  bool success = 1;
  User user = 2;
  string message = 3;
  string error = 4;
}

// Delete user request and response
message DeleteUserRequest {
  string id = 1;
}

message DeleteUserResponse {
  bool success = 1;
  string message = 2;
  string error = 3;
}