name: Enhanced CI/CD Pipeline
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run linting
      run: npm run lint

    - name: Run tests
      run: npm test
      env:
        CI: true

    - name: Run build
      run: npm run build

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Run security audit
      run: npm audit --audit-level moderate

    - name: Run Snyk to check for vulnerabilities
      uses: snyk/actions/node@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --all-projects --severity-threshold=medium

    - name: Run CodeQL Analysis
      uses: github/codeql-action/analyze@v2
      with:
        category: "/language:javascript"

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'HIGH,CRITICAL'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  docker:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push user-service
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./apps/user-service/Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/ai-job-applier-user-service:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/ai-job-applier-user-service:${{ github.sha }}
        build-args: |
          NODE_ENV=production

    - name: Build and push auth-service
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./apps/auth-service/Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/ai-job-applier-auth-service:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/ai-job-applier-auth-service:${{ github.sha }}
        build-args: |
          NODE_ENV=production

    - name: Build and push job-discovery-service
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./apps/job-discovery-service/Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/ai-job-applier-job-discovery-service:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/ai-job-applier-job-discovery-service:${{ github.sha }}
        build-args: |
          NODE_ENV=production

    - name: Build and push api-gateway
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./apps/api-gateway/Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/ai-job-applier-api-gateway:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/ai-job-applier-api-gateway:${{ github.sha }}
        build-args: |
          NODE_ENV=production

  docker-security-scan:
    needs: docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Run Trivy vulnerability scanner on Docker images
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'image'
        image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/ai-job-applier-user-service:latest
        format: 'table'
        exit-code: '1'
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'HIGH,CRITICAL'

    - name: Run Trivy vulnerability scanner on auth service
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'image'
        image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/ai-job-applier-auth-service:latest
        format: 'table'
        exit-code: '1'
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'HIGH,CRITICAL'

    - name: Run Trivy vulnerability scanner on job discovery service
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'image'
        image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/ai-job-applier-job-discovery-service:latest
        format: 'table'
        exit-code: '1'
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'HIGH,CRITICAL'

    - name: Run Trivy vulnerability scanner on api gateway
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'image'
        image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/ai-job-applier-api-gateway:latest
        format: 'table'
        exit-code: '1'
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'HIGH,CRITICAL'

  compliance-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Check for secrets in code
      uses: reviewdog/action-semgrep@v1
      with:
        github_token: ${{ secrets.github_token }}
        level: 'error'
        run_extra: |
          semgrep --config=p/r2c-security-audit --error